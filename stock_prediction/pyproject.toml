[project]
name = "stock-prediction"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "datasets>=2.18.0",
    "fastapi>=0.110.0",
    "httpx>=0.27.0",
    "matplotlib>=3.10.8",
    "nbformat>=5.10.4",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0",
    "pytest>=8.0.0",
    "python-dotenv>=1.0.0",
    "scikit-learn>=1.4.0",
    "scipy>=1.17.1",
    "seaborn>=0.13.2",
    "sentencepiece>=0.2.1",
    "ta>=0.11.0",
    "torch>=2.2.0",
    "transformers>=4.38.0",
    "uvicorn[standard]>=0.29.0",
]

[project.optional-dependencies]
dev = [
    "ipykernel>=6.29",
    "ipywidgets>=8.0",
    "jupyterlab>=4.0",
]

[project.scripts]
jupyter-notebook-eda = "scripts._jupyter:main"

[tool.uv]
package = true

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["scripts*"]
